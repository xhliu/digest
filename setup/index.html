<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="dark light"><title>Set up the lock</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e7e9ea;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{width:min(92vw,420px);padding:24px}h1{font:700 26px Georgia,serif;margin:0 0 6px}p{color:#8b919a;margin:0 0 16px;font-size:14px}input[type=password],input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #3a3e44;background:#171a1f;color:inherit;font:16px -apple-system,sans-serif}label{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:14px}button{font:600 15px -apple-system,sans-serif;padding:11px 16px;border-radius:10px;border:1px solid #3a3e44;background:#e7e9ea;color:#0f1115;cursor:pointer}button.alt{background:none;color:#8b919a;border:0;padding:8px 0;font-weight:500}button:disabled{opacity:.5}.err,.bad{color:#e5735f;font-size:14px;min-height:20px;margin:8px 0}.ok{color:#2f9e57;font-size:14px;margin:8px 0}.st{color:#8b919a;font-size:14px;min-height:20px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}textarea{height:120px;font:13px ui-monospace,monospace;word-break:break-all}</style></head><body data-root="../" data-mode="setup"><main><h1>Set up the lock</h1><p>Pick a passcode of at least 5 random words. It is turned into a key right here in the browser (PBKDF2-SHA256, 600,000 rounds) and never leaves this page. The result is a public "lock code" to give WuKong.</p><input id="p1" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="new-password"><div style="height:8px"></div><input id="p2" type="password" placeholder="Passcode again" aria-label="Passcode again" autocomplete="new-password"><div id="meter" class="bad"></div><div id="match" class="bad"></div><div class="row"><button id="gen" type="button" class="alt" style="border:1px solid #3a3e44;padding:10px 14px" disabled>🎲 Generate 5 words</button><button id="make" type="button" disabled>Make lock code</button></div><div id="status" class="st"></div><div id="out" hidden><textarea id="lock" readonly aria-label="Lock code"></textarea><div class="row"><button id="copy" type="button">Copy lock code</button></div></div></main><script src="../v.js"></script></body></html>
